  <h2 class="detail-title" id="detail-title">项目与实践</h2>
  <div class="portfolio-copy">
<h3>小红书跨文化研究与互动展览</h3>
<p><strong>2026 年第二学期｜Understanding Global Media｜五人小组项目</strong></p>
<p><strong>研究问题</strong>　2025 年 1 月，一批原本使用 TikTok 的海外用户进入小红书。项目关注新用户与原有用户如何在评论区交流、协商语言使用和社区参与方式。独立确定研究问题，搜集学术文献、帖文与评论、新闻和政策材料，并据此提炼核心论点。</p>
<p><strong>研究与发现</strong>　选取五则公开帖子，结合正文、图片和可见评论进行定性细读。所选案例中，原有用户为新用户提供翻译建议，也表达了对使用中文和相互尊重的期待。展册以「猫税」为例，呈现社区成员如何用评论和象征性的「收据」回应新用户分享的猫咪照片。</p>
